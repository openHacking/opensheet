name: Bug report
description: Report a reproducible problem using a minimal, non-sensitive example.
body:
  - type: textarea
    attributes:
      label: Reproduction
      description: Include OpenSheet version, browser, minimal code or a synthetic workbook.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs or screenshots
      description: Remove private data and secrets. Do not disclose security vulnerabilities here.
